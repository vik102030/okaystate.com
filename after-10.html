<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>After check-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;
  background:#0f1115;
  color:#f2f2f2;
}
.screen {
  min-height:100vh;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:32px;
  text-align:center;
}
.screen.active { display:flex; }
p { max-width:560px; line-height:1.6; opacity:.9; }
button {
  margin-top:28px;
  padding:14px 28px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}
.primary { background:#fff; color:#000; }
</style>
</head>

<body>

<section class="screen active" id="a1">
  <p>
    You don’t need to rush.
    Awareness doesn’t come from pushing harder.
    It comes from noticing honestly.
  </p>
  <button class="primary" onclick="next(2)">Continue</button>
</section>

<section class="screen" id="a2">
  <p>
    Sometimes clarity disappears before it returns.
    Transitions often feel like confusion.
  </p>
  <button class="primary" onclick="next(3)">Continue</button>
</section>

<section class="screen" id="a3">
  <p>
    Something may have stopped aligning —
    not dramatically, but quietly over time.
  </p>
  <button class="primary" onclick="window.location.href='after-50.html'">
    Go deeper
  </button>
</section>

<script>
function next(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('a'+n).classList.add('active');
  window.scrollTo(0,0);
}
</script>

</body>
</html>
